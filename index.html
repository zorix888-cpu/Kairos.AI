<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MiniGPT — Chat + Code</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />

<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2230; --border: #2a3240;
    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --accent-2: #3fb950;
    --user-bubble: #1f6feb33; --bot-bubble: #21262d; --code-bg: #0b0f14;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 650; }
  header .logo { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--muted); }
  button {
    cursor: pointer; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); border-radius: 9px; padding: 9px 13px; font-size: 14px;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; }
  .icon-btn { padding: 9px 11px; font-size: 16px; }

  /* ---------- Settings panel (collapsible) ---------- */
  #settings {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 0 14px; max-height: 0; overflow: hidden; transition: max-height .25s ease, padding .25s ease;
  }
  #settings.open { max-height: 380px; padding: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 11px 12px; font-size: 15px; width: 100%;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); margin: 2px 0 10px; line-height: 1.4; }

  /* ---------- Tabs (mobile) ---------- */
  .tabbar { display: none; }
  @media (max-width: 820px) {
    .tabbar {
      display: flex; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .tabbar button {
      flex: 1; border: none; border-radius: 0; background: transparent;
      padding: 13px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent;
    }
    .tabbar button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .col { display: none; }
    .col.active { display: flex; }
  }

  /* ---------- Layout ---------- */
  main { flex: 1; display: flex; gap: 1px; min-height: 0; background: var(--border); }
  .col { display: flex; flex-direction: column; min-height: 0; background: var(--bg); flex: 1; }
  #chatCol { flex: 1.15; }

  /* ---------- Chat ---------- */
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.bot .avatar { background: var(--accent-2); color: #06210f; }
  .bubble { background: var(--bot-bubble); padding: 11px 14px; border-radius: 14px; line-height: 1.6; font-size: 15px; overflow-x: auto; max-width: 100%; }
  .msg.user .bubble { background: var(--user-bubble); }
  .bubble pre { margin: 10px 0; }
  .bubble code { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .bubble :not(pre) > code { background: #00000055; padding: 2px 5px; border-radius: 4px; }
  .bubble pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow-x: auto; }
  .bubble pre code { background: none; padding: 0; }
  .copy-btn { float: right; margin: -4px -4px 6px 8px; font-size: 11px; padding: 4px 8px; background: #2a3240; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay: .2s; } .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{ opacity:.2 } 30%{ opacity:1 } }

  #composer { display: flex; gap: 8px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--panel); }
  #userInput { flex: 1; resize: none; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.4; max-height: 140px; min-height: 46px; }
  #userInput:focus { outline: none; border-color: var(--accent); }

  /* ---------- Code panel ---------- */
  #codeToolbar { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  #codeToolbar select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  #editor { flex: 1; width: 100%; border: none; resize: none; background: var(--code-bg); color: #d6e1ef; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.5; padding: 12px; min-height: 0; }
  #editor:focus { outline: none; }
  #runOutput { height: 32%; overflow-y: auto; background: #05080c; border-top: 1px solid var(--border); padding: 10px 12px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #b9c4d4; white-space: pre-wrap; }
  #runOutput .err { color: #ff7b72; } #runOutput .sys { color: var(--muted); }
  .controls-row { display: flex; gap: 8px; padding: 9px 12px; padding-bottom: max(9px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--panel); }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 11px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1><span class="logo"></span> MiniGPT</h1>
  <div class="spacer"></div>
  <span id="status">● enter key</span>
  <button class="ghost icon-btn" id="gearBtn" title="Settings">⚙️</button>
</header>

<div id="settings">
  <div class="field">
    <label>Provider</label>
    <select id="provider">
      <option value="groq">Groq (free)</option>
      <option value="openai">OpenAI</option>
      <option value="openrouter">OpenRouter</option>
      <option value="custom">Custom</option>
    </select>
  </div>
  <div class="field">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="paste your key" autocomplete="off" inputmode="text" />
  </div>
  <div class="field">
    <label>Model</label>
    <input id="modelName" list="modelList" placeholder="model id" autocomplete="off" />
    <datalist id="modelList">
      <option value="llama-3.3-70b-versatile"></option>
      <option value="llama-3.1-8b-instant"></option>
      <option value="llama-4-scout-17b-16e-instruct"></option>
      <option value="gpt-oss-120b"></option>
    </datalist>
  </div>
  <p class="hint">Groq is free — sign up at console.groq.com, make a key, paste it above. Your key is saved only in this browser.</p>
</div>

<nav class="tabbar">
  <button id="tabChat" class="active">💬 Chat</button>
  <button id="tabCode">⌨️ Code</button>
</nav>

<main>
  <section class="col active" id="chatCol">
    <div id="messages"></div>
    <div id="composer">
      <textarea id="userInput" placeholder="Ask anything… (Enter to send)" rows="1"></textarea>
      <button class="primary" id="sendBtn">Send</button>
      <button class="ghost" id="stopBtn" style="display:none;">Stop</button>
    </div>
  </section>

  <section class="col" id="codeCol">
    <div id="codeToolbar">
      <select id="langSelect">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
      </select>
      <button class="ghost" id="sampleBtn">Sample</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="runOutput"><span class="sys">Output appears here…</span></div>
    <div class="controls-row">
      <button class="primary" id="runBtn">▶ Run</button>
      <button class="ghost" id="clearOutBtn">Clear</button>
      <button class="ghost" id="toChatBtn">To chat →</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

const PROVIDERS = {
  groq:      { base: "https://api.groq.com/openai/v1",      model: "llama-3.3-70b-versatile" },
  openai:    { base: "https://api.openai.com/v1",          model: "gpt-4o-mini" },
  openrouter:{ base: "https://openrouter.ai/api/v1",       model: "openai/gpt-4o-mini" },
  custom:    { base: "",                                   model: "" }
};

/* ---------- Settings: save + load ---------- */
function saveSettings() {
  const p = $("provider").value;
  localStorage.setItem("mg_provider", p);
  localStorage.setItem("mg_key", $("apiKey").value);
  localStorage.setItem("mg_model", $("modelName").value);
  const cfg = PROVIDERS[p];
  if (cfg && cfg.model && !$("modelName").value) $("modelName").value = cfg.model;
}
function loadSettings() {
  $("provider").value  = localStorage.getItem("mg_provider") || "groq";
  $("apiKey").value    = localStorage.getItem("mg_key") || "";
  const cfg = PROVIDERS[$("provider").value];
  $("modelName").value = localStorage.getItem("mg_model") || (cfg ? cfg.model : "");
}
$("provider").addEventListener("change", () => {
  const cfg = PROVIDERS[$("provider").value];
  if (cfg && cfg.model && !$("modelName").value) $("modelName").value = cfg.model;
  saveSettings(); updateStatus();
});
$("apiKey").addEventListener("input", saveSettings);
$("modelName").addEventListener("input", saveSettings);

function apiBase() { const p = $("provider").value; return (PROVIDERS[p] && PROVIDERS[p].base) || ""; }
function updateStatus() {
  const st = $("status");
  if (!$("apiKey").value) { st.textContent = "● enter key"; st.style.color = "#ff7b72"; }
  else { st.textContent = "● ready"; st.style.color = "var(--accent-2)"; }
}

/* ---------- Settings toggle ---------- */
$("gearBtn").onclick = () => $("settings").classList.toggle("open");

/* ---------- Tabs ---------- */
function showTab(which) {
  document.querySelectorAll(".col").forEach(c => c.classList.remove("active"));
  $(which + "Col").classList.add("active");
  $("tabChat").classList.toggle("active", which === "chat");
  $("tabCode").classList.toggle("active", which === "code");
}
$("tabChat").onclick = () => showTab("chat");
$("tabCode").onclick = () => showTab("code");

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ---------- Markdown ---------- */
function renderMarkdown(text) {
  if (window.marked) { marked.setOptions({ breaks: true, gfm: true }); return marked.parse(text); }
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>");
}

/* ---------- Chat ---------- */
const messagesEl = $("messages");
let conversation = [];
let abortCtrl = null;

function addMessage(role) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar"; avatar.textContent = role === "user" ? "U" : "AI";
  const bubble = document.createElement("div"); bubble.className = "bubble";
  wrap.appendChild(avatar); wrap.appendChild(bubble); messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}
function appendStreaming(bubble, text) {
  bubble.innerHTML = renderMarkdown(text);
  bubble.querySelectorAll("pre code").forEach(applyHighlight);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function applyHighlight(block) {
  if (window.hljs) { try { hljs.highlightElement(block); } catch (e) {} }
  const pre = block.parentElement;
  if (pre && !pre.querySelector(".copy-btn")) {
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.textContent = "copy";
    btn.onclick = () => { navigator.clipboard.writeText(block.textContent); btn.textContent = "copied!"; setTimeout(() => (btn.textContent = "copy"), 1200); };
    pre.insertBefore(btn, pre.firstChild);
  }
}

async function sendMessage() {
  const input = $("userInput");
  const text = input.value.trim();
  if (!text) return;
  if (!$("apiKey").value) { toast("Tap ⚙️ and paste your API key first"); $("settings").classList.add("open"); return; }
  input.value = ""; input.style.height = "auto";
  addMessage("user"); conversation.push({ role: "user", content: text });

  const bubble = addMessage("bot");
  const typing = document.createElement("div");
  typing.className = "typing"; typing.innerHTML = "<span></span><span></span><span></span>";
  bubble.appendChild(typing);
  $("sendBtn").style.display = "none"; $("stopBtn").style.display = "inline-block";
  abortCtrl = new AbortController();

  const model = $("modelName").value || (PROVIDERS[$("provider").value] && PROVIDERS[$("provider").value].model);
  let full = "";
  try {
    const res = await fetch(apiBase() + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + $("apiKey").value },
      body: JSON.stringify({ model, messages: conversation, stream: true }),
      signal: abortCtrl.signal,
    });
    if (!res.ok) {
      const errTxt = await res.text();
      let msg = "HTTP " + res.status;
      try { const j = JSON.parse(errTxt); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        let line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") break;
        try {
          const obj = JSON.parse(data);
          const delta = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
          if (delta) full += delta;
        } catch (e) {}
      }
      typing.remove();
      appendStreaming(bubble, full);
    }
    conversation.push({ role: "assistant", content: full });
  } catch (e) {
    typing.remove();
    if (e.name === "AbortError") { bubble.innerHTML = "<span class='sys'>(stopped)</span>"; conversation.push({ role: "assistant", content: full }); }
    else {
      let m = e.message;
      if (m.toLowerCase().includes("failed to fetch") || m.toLowerCase().includes("networkerror"))
        m = "Network/CORS error. If your provider blocks browser requests, use a proxy or host on a backend.";
      bubble.innerHTML = "<span class='err'>⚠️ " + m + "</span>";
    }
  } finally {
    $("sendBtn").style.display = "inline-block"; $("stopBtn").style.display = "none"; abortCtrl = null;
  }
}

$("sendBtn").onclick = sendMessage;
$("stopBtn").onclick = () => { if (abortCtrl) abortCtrl.abort(); };
$("userInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
$("userInput").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px"; });

/* ---------- Code runner ---------- */
const samples = {
  javascript: `// Runs in your browser (sandboxed)
console.log("Hello from MiniGPT!");
const nums = [1,2,3,4,5];
console.log("Squares:", nums.map(n => n*n));`,
  python: `# Runs via Pyodide (loads from CDN first run)
print("Hello from Python!")
nums = [1,2,3,4,5]
print("Squares:", [n*n for n in nums])`
};
function setOutput(text, cls = "") {
  const out = $("runOutput");
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = text; out.appendChild(line); out.scrollTop = out.scrollHeight;
}
function clearOutput() { $("runOutput").innerHTML = '<span class="sys">Output appears here…</span>'; }
$("langSelect").onchange = loadSample;
$("sampleBtn").onclick = loadSample;
function loadSample() { $("editor").value = samples[$("langSelect").value] || ""; }
$("clearOutBtn").onclick = clearOutput;
$("runBtn").onclick = runCode;
async function runCode() {
  const lang = $("langSelect").value;
  const code = $("editor").value;
  clearOutput();
  if (!code.trim()) { setOutput("Nothing to run.", "sys"); return; }
  if (lang === "javascript") runJS(code);
  else {
    setOutput("Loading Pyodide… (first run only)", "sys");
    try { await loadPyodideRuntime(); setOutput("Python ready:", "sys"); await runPython(code); }
    catch (e) { setOutput("Error: " + e.message, "err"); }
  }
}
function runJS(code) {
  const html = `<!DOCTYPE html><html><head></head><body><script>
    const send = (type, args) => parent.postMessage(
      { __mg: true, type, text: args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') }, '*');
    console.log = (...a) => send('log', a);
    console.error = (...a) => send('err', a);
    window.onerror = (m) => send('err', [m]);
    try { (async () => { ${code} })().catch(e => send('err', [e.message])); }
    catch (e) { send('err', [e.message]); }
  <\/script></body></html>`;
  const ifr = document.createElement("iframe");
  ifr.style.display = "none"; ifr.sandbox = "allow-scripts"; document.body.appendChild(ifr);
  ifr.srcdoc = html;
  const handler = (ev) => { if (!ev.data || !ev.data.__mg) return; setOutput(ev.data.text, ev.data.type === "err" ? "err" : ""); };
  window.addEventListener("message", handler);
  setTimeout(() => { ifr.remove(); window.removeEventListener("message", handler); }, 8000);
}
let pyodideReady = null;
function loadPyodideRuntime() {
  if (pyodideReady) return pyodideReady;
  pyodideReady = new Promise((resolve, reject) => {
    if (window.loadPyodide) return resolve(window.loadPyodide);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
    s.onload = async () => { try { window._py = await loadPyodide(); resolve(window.loadPyodide); } catch (e) { reject(e); } };
    s.onerror = () => reject(new Error("Couldn't load Pyodide (need internet on first run)"));
    document.head.appendChild(s);
  });
  return pyodideReady;
}
async function runPython(code) {
  const loadPyodide = await loadPyodideRuntime();
  const py = window._py || await loadPyodide();
  py.setStdout({ batched: (s) => setOutput(s) });
  py.setStderr({ batched: (s) => setOutput(s, "err") });
  try { await py.runPythonAsync(code); } catch (e) { setOutput(String(e), "err"); }
}
$("toChatBtn").onclick = () => {
  const lang = $("langSelect").value;
  const code = $("editor").value.trim();
  if (!code) { toast("Editor is empty"); return; }
  $("userInput").value = "Here's my " + lang + " code:\n\n```" + lang + "\n" + code + "\n```\n\nWhat does it do and how can I improve it?";
  $("userInput").focus();
  if (window.matchMedia("(max-width: 820px)").matches) showTab("chat");
};

/* ---------- Boot ---------- */
loadSettings();
loadSample();
updateStatus();
</script>
</body>
</html>
