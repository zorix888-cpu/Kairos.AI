<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>HAKIMI — Personal Intelligence Environment</title>
<meta name="description" content="HAKIMI private luxury intelligence environment with text, voice, memory, documents, and a 3D core." />
<!-- FIX 1: three r0.149.2 removed examples/js (OrbitControls), which broke the 3D scene. Pinned to r0.128.0 where it exists. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--black:#050506;--panel:rgba(18,18,21,.72);--line:rgba(255,255,255,.12);--line-strong:rgba(255,255,255,.26);--white:#f4f1eb;--muted:#9b9a98;--soft:#c8c3ba;--accent:#d6c5a5;--success:#b7d3bd;--radius:24px;--ease:cubic-bezier(.2,.8,.2,1);--shadow:0 28px 90px rgba(0,0,0,.42)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
#app{height:100svh;min-height:640px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#171514 0%,#080809 45%,#030304 100%)}
#scene{position:absolute;inset:0;z-index:0}
#scene canvas{display:block;width:100%;height:100%}
.scene-shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.06) 45%,rgba(0,0,0,.62) 100%),linear-gradient(180deg,rgba(0,0,0,.32),transparent 25%,transparent 75%,rgba(0,0,0,.54))}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");mix-blend-mode:screen;animation:grain 1s steps(2) infinite}
@keyframes grain{0%,100%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}}
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;height:76px;display:flex;align-items:center;gap:18px;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(4,4,5,.86),rgba(4,4,5,.2));backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;min-width:210px}
.mark{width:32px;height:32px;border-radius:50%;position:relative;background:radial-gradient(circle at 34% 28%,#fff 0 4%,#cbbd9f 12%,#4c463c 42%,#0b0b0c 72%);box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 22px rgba(214,197,165,.2)}
.mark:before,.mark:after{content:"";position:absolute;inset:-5px;border:1px solid rgba(214,197,165,.5);border-radius:50%;transform:rotate(28deg)}
.mark:after{inset:-9px;opacity:.35;transform:rotate(-38deg)}
.brand-name{font-weight:700;letter-spacing:.22em;font-size:14px}
.brand-sub{color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.top-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success)}
.top-spacer{flex:1}
.top-actions{display:flex;gap:8px}
.icon-btn,.ghost-btn{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:12px;min-width:38px;height:38px;display:grid;place-items:center;transition:.25s var(--ease)}
.icon-btn:hover,.ghost-btn:hover{border-color:var(--line-strong);background:rgba(255,255,255,.1);transform:translateY(-1px)}
.icon-btn.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 20px rgba(214,197,165,.14)}
.layout{position:absolute;z-index:2;inset:76px 0 0;display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(270px,330px);gap:18px;padding:18px clamp(16px,3vw,46px) 22px}
.rail,.workspace,.inspector{min-height:0}
.rail,.inspector{display:flex;flex-direction:column;gap:14px}
.glass{background:linear-gradient(145deg,rgba(29,28,27,.67),rgba(10,10,12,.58));border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(22px);border-radius:var(--radius)}
.rail-head{display:flex;justify-content:space-between;align-items:center;padding:17px 18px 12px}
.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.rail-section{padding:0 10px 12px}
.nav-item,.session{display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;border-radius:14px;background:transparent;padding:11px 10px;color:var(--soft);text-align:left;transition:.25s var(--ease)}
.nav-item:hover,.session:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.nav-item.active,.session.active{background:linear-gradient(90deg,rgba(214,197,165,.16),rgba(255,255,255,.025));border-color:rgba(214,197,165,.3);color:var(--white)}
.nav-icon{width:20px;color:var(--accent);text-align:center}
.session-list{max-height:220px;overflow:auto}
.session strong{font-size:12px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.new-session{margin:0 8px;width:calc(100% - 16px);padding:11px;border-radius:12px;border:1px solid rgba(214,197,165,.4);background:rgba(214,197,165,.09);color:var(--accent);font-size:12px}
.profile-card{margin-top:auto;padding:15px;display:flex;align-items:center;gap:12px}
.avatar-small{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff,#9c927e 20%,#171718 68%);color:#111;font-size:12px}
.profile-name{font-size:12px}
.profile-label{font-size:10px;color:var(--muted);margin-top:3px}
.workspace{position:relative;display:flex;flex-direction:column;min-width:0}
.core-stage{position:relative;min-height:390px;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:32px}
.stage-caption{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.stage-caption .eyebrow:last-child{color:var(--accent)}
.core-hud{position:absolute;left:50%;top:50%;width:min(64vw,520px);height:min(64vw,520px);transform:translate(-50%,-50%);border:1px solid rgba(214,197,165,.18);border-radius:50%;pointer-events:none;box-shadow:0 0 50px rgba(214,197,165,.04),inset 0 0 50px rgba(214,197,165,.035)}
.core-hud:before,.core-hud:after{content:"";position:absolute;inset:8%;border:1px dashed rgba(255,255,255,.1);border-radius:50%;animation:orbit 30s linear infinite}
.core-hud:after{inset:18%;border-style:solid;border-color:rgba(214,197,165,.12) transparent;animation-duration:18s;animation-direction:reverse}
@keyframes orbit{to{transform:rotate(360deg)}}
.hud-tick{position:absolute;top:-5px;left:50%;width:1px;height:10px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.core-label{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;text-align:center;pointer-events:none}
.core-label strong{font-size:12px;letter-spacing:.2em;font-weight:500}
.core-label span{display:block;color:var(--muted);font-size:10px;margin-top:5px;letter-spacing:.12em;text-transform:uppercase}
.core-state{color:var(--accent)!important}
.conversation{padding:14px 4px 0;max-height:35%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.message{display:flex;gap:10px;max-width:88%;animation:messageIn .45s var(--ease)}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.message-bubble{padding:12px 15px;border:1px solid var(--line);background:rgba(15,15,17,.74);border-radius:17px 17px 17px 5px;color:var(--soft);font-size:13px;line-height:1.65;box-shadow:0 10px 30px rgba(0,0,0,.17)}
.message.user .message-bubble{border-radius:17px 17px 5px 17px;background:rgba(214,197,165,.13);border-color:rgba(214,197,165,.26);color:var(--white)}
.message-avatar{width:26px;height:26px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:9px;border:1px solid var(--line-strong);color:var(--accent)}
@keyframes messageIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.typing-line{display:flex;gap:4px;align-items:center;color:var(--muted)}
.typing-line i{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:typing 1.2s infinite}
.typing-line i:nth-child(2){animation-delay:.15s}
.typing-line i:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.composer{margin-top:14px;padding:10px;display:flex;align-items:flex-end;gap:9px}
.composer textarea{flex:1;min-width:0;resize:none;background:transparent;border:0;color:var(--white);font-size:14px;line-height:1.55;max-height:110px;min-height:42px;padding:10px 4px}
.composer textarea::placeholder{color:#747372}
.send-btn{width:42px;height:42px;border-radius:13px;border:1px solid rgba(214,197,165,.55);background:linear-gradient(145deg,#d6c5a5,#786c59);color:#111;display:grid;place-items:center;transition:.25s var(--ease)}
.send-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(214,197,165,.2)}
.composer-tools{display:flex;gap:6px}
.mini-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted)}
.mini-btn.active{color:var(--accent);border-color:var(--accent)}
.inspector-card{padding:16px}
.inspector-card h3{font-size:
