<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>MoonGPT</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />

<style>
  :root {
    --bg: #0a0d14;
    --surface: #10141f;
    --surface-2: #171c2b;
    --surface-3: #1e2536;
    --border: #262e42;
    --text: #e9edf6;
    --muted: #8893a7;
    --accent: #6c8cff;
    --accent-2: #9a7bff;
    --accent-grad: linear-gradient(135deg, #6c8cff, #9a7bff);
    --danger: #ff7b72;
    --code-bg: #070a10;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app {
    height: 100dvh; height: 100svh;
    display: flex; flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: rgba(16,20,31,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .2px;
    background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  #status.ok::before { background: #3fb950; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 18px; display: grid; place-items: center; }
  .icon-btn:active { transform: scale(.94); }

  /* ---------- Screens ---------- */
  #screens { flex: 1; position: relative; min-height: 0; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }

  /* ---------- Chat ---------- */
  #messages { flex: 1; overflow-y: auto; padding: 14px 12px 6px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .msg.bot .avatar { background: var(--accent-grad); color: #fff; }
  .msg.user .avatar { background: var(--surface-3); color: var(--muted); }
  .bubble { max-width: 80%; padding: 10px 13px; border-radius: 18px; line-height: 1.55; font-size: 15px; overflow-x: auto; }
  .msg.bot .bubble { background: var(--surface-2); border-bottom-left-radius: 6px; }
  .msg.user .bubble { background: var(--accent-grad); color: #fff; border-bottom-right-radius: 6px; }
  .bubble pre { margin: 8px 0; }
  .bubble code { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .bubble :not(pre) > code { background: rgba(255,255,255,.14); padding: 2px 5px; border-radius: 5px; }
  .msg.bot .bubble :not(pre) > code { background: rgba(0,0,0,.35); }
  .bubble pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px; overflow-x: auto; }
  .bubble pre code { background: none; padding: 0; }
  .copy-btn { float: right; margin: -3px -3px 6px 8px; font-size: 10px; padding: 3px 7px; background: var(--surface-3); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay: .2s; } .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{ opacity:.2 } 30%{ opacity:1 } }

  #composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(16,20,31,.9); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
  #userInput { flex: 1; resize: none; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 22px; padding: 12px 16px; font-size: 16px; line-height: 1.4; max-height: 120px; min-height: 44px; }
  #userInput:focus { outline: none; border-color: var(--accent); }
  .send { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent-grad); color: #fff; font-size: 20px; display: grid; place-items: center; flex-shrink: 0; }
  .send:active { transform: scale(.92); }
  .stop { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-3); color: var(--text); font-size: 14px; flex-shrink: 0; }

  /* ---------- Code screen ---------- */
  #codeToolbar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
  #codeToolbar select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 14px; }
  .pill-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 10px; padding: 9px 13px; font-size: 14px; }
  .pill-btn:active { transform: scale(.96); }
  #editor { flex: 1 1 auto; width: 100%; border: none; resize: none; background: var(--code-bg); color: #d6e1ef; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.5; padding: 14px; min-height: 120px; }
  #editor:focus { outline: none; }
  #runOutput { flex: 0 0 30%; overflow-y: auto; background: #05080c; border-top: 1px solid var(--border); padding: 10px 12px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: #b9c4d4; white-space: pre-wrap; }
  #runOutput .err { color: var(--danger); } #runOutput .sys { color: var(--muted); }
  .code-controls { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
  .run-btn { flex: 1; background: var(--accent-grad); border: none; color: #fff; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 600; }
  .run-btn:active { transform: scale(.98); }

  /* ---------- Bottom tab bar ---------- */
  #tabbar { display: flex; background: rgba(16,20,31,.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  #tabbar button { flex: 1; border: none; background: transparent; color: var(--muted); padding: 10px 0 12px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #tabbar button .ic { font-size: 20px; }
  #tabbar button.active { color: var(--text); }
  #tabbar button.active .ic { filter: drop-shadow(0 0 6px var(--accent)); }

  /* ---------- Settings sheet ---------- */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 80; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .28s ease; z-index: 90; max-height: 88dvh; overflow-y: auto; border-top: 1px solid var(--border); }
  #sheet.open { transform: translateY(0); }
  .handle { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 8px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sheet-head h2 { font-size: 17px; margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input, .field select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; font-size: 15px; width: 100%; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .model-row { display: flex; gap: 8px; }
  .model-row input { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0 0 8px; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--border); color: var(--text); padding: 12px 18px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 100; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>🌙 MoonGPT</h1>
    <div class="spacer"></div>
    <span id="status">enter key</span>
    <button class="icon-btn" id="gearBtn" title="Settings">⚙️</button>
  </header>

  <div id="screens">
    <!-- CHAT -->
    <section class="screen active" id="chatScreen">
      <div id="messages"></div>
      <div id="composer">
        <textarea id="userInput" placeholder="Message MoonGPT…" rows="1"></textarea>
        <button class="send" id="sendBtn">➤</button>
        <button class="stop" id="stopBtn" style="display:none;">■</button>
      </div>
    </section>

    <!-- CODE -->
    <section class="screen" id="codeScreen">
      <div id="codeToolbar">
        <select id="langSelect">
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
        </select>
        <button class="pill-btn" id="sampleBtn">Sample</button>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="runOutput"><span class="sys">Output appears here…</span></div>
      <div class="code-controls">
        <button class="run-btn" id="runBtn">▶ Run code</button>
        <button class="pill-btn" id="clearOutBtn">Clear</button>
        <button class="pill-btn" id="toChatBtn">To chat</button>
      </div>
    </section>
  </div>

  <nav id="tabbar">
    <button id="tabChat" class="active"><span class="ic">💬</span>Chat</button>
    <button id="tabCode"><span class="ic">⌨️</span>Code</button>
  </nav>
</div>

<!-- Settings bottom sheet -->
<div id="backdrop"></div>
<div id="sheet">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2>Settings</h2>
    <button class="icon-btn" id="closeSheet">✕</button>
  </div>
  <div class="field">
    <label>Provider</label>
    <select id="provider">
      <option value="groq">Groq (free)</option>
      <option value="openai">OpenAI</option>
      <option value="openrouter">OpenRouter</option>
      <option value="custom">Custom</option>
    </select>
  </div>
  <div class="field">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="paste your key" autocomplete="off" />
  </div>
  <div class="field">
    <label>Model</label>
    <div class="model-row">
      <input id="modelName" list="modelList" placeholder="tap Get" autocomplete="off" />
      <button class="pill-btn" id="fetchModelsBtn" type="button">🔄 Get</button>
    </div>
    <datalist id="modelList">
      <option value="llama-4-scout-17b-16e-instruct"></option>
      <option value="llama-3.3-70b-versatile"></option>
      <option value="llama-3.1-8b-instant"></option>
    </datalist>
  </div>
  <p class="hint">Groq is free — sign up at console.groq.com, make a key, paste it, then tap <b>🔄 Get</b> to load the models your key can use. Your key stays only in this browser.</p>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

const PROVIDERS = {
  groq:      { base: "https://api.groq.com/openai/v1",      model: "llama-4-scout-17b-16e-instruct" },
  openai:    { base: "https://api.openai.com/v1",          model: "gpt-4o-mini" },
  openrouter:{ base: "https://openrouter.ai/api/v1",       model: "openai/gpt-4o-mini" },
  custom:    { base: "",                                   model: "" }
};

function saveSettings() {
  const p = $("provider").value;
  localStorage.setItem("mg_provider", p);
  localStorage.setItem("mg_key", $("apiKey").value);
  localStorage.setItem("mg_model", $("modelName").value);
  const cfg = PROVIDERS[p];
  if (cfg && cfg.model && !$("modelName").value) $("modelName").value = cfg.model;
}
function loadSettings() {
  $("provider").value  = localStorage.getItem("mg_provider") || "groq";
  $("apiKey").value    = localStorage.getItem("mg_key") || "";
  const cfg = PROVIDERS[$("provider").value];
  $("modelName").value = localStorage.getItem("mg_model") || (cfg ? cfg.model : "");
}
$("provider").addEventListener("change", () => {
  const cfg = PROVIDERS[$("provider").value];
  if (cfg && cfg.model && !$("modelName").value) $("modelName").value = cfg.model;
  saveSettings(); updateStatus();
});
$("apiKey").addEventListener("input", saveSettings);
$("modelName").addEventListener("input", saveSettings);

function apiBase() { const p = $("provider").value; return (PROVIDERS[p] && PROVIDERS[p].base) || ""; }
function updateStatus() {
  const st = $("status");
  if (!$("apiKey").value) { st.textContent = "enter key"; st.classList.remove("ok"); }
  else { st.textContent = "ready"; st.classList.add("ok"); }
}

/* ---------- Settings sheet ---------- */
function openSheet() { $("backdrop").classList.add("open"); $("sheet").classList.add("open"); }
function closeSheet() { $("backdrop").classList.remove("open"); $("sheet").classList.remove("open"); }
$("gearBtn").onclick = openSheet;
$("closeSheet").onclick = closeSheet;
$("backdrop").onclick = closeSheet;

/* ---------- Tabs ---------- */
function showTab(which) {
  $("chatScreen").classList.toggle("active", which === "chat");
  $("codeScreen").classList.toggle("active", which === "code");
  $("tabChat").classList.toggle("active", which === "chat");
  $("tabCode").classList.toggle("active", which === "code");
}
$("tabChat").onclick = () => showTab("chat");
$("tabCode").onclick = () => showTab("code");

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

function renderMarkdown(text) {
  if (window.marked) { marked.setOptions({ breaks: true, gfm: true }); return marked.parse(text); }
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>");
}

/* ---------- Fetch models ---------- */
async function fetchModels() {
  if (!$("apiKey").value) { toast("Enter your API key first"); openSheet(); return; }
  const btn = $("fetchModelsBtn"); btn.disabled = true; btn.textContent = "…";
  try {
    const res = await fetch(apiBase() + "/models", { headers: { "Authorization": "Bearer " + $("apiKey").value } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    const ids = (j.data || []).map(m => m.id).filter(Boolean);
    if (!ids.length) throw new Error("no models returned");
    $("modelList").innerHTML = ids.map(id => '<option value="' + id + '"></option>').join("");
    const preferred = ids.find(id => /llama|gpt-oss|qwen|mistral|gemma/i.test(id)) || ids[0];
    $("modelName").value = preferred;
    saveSettings();
    toast("Found " + ids.length + " models — using " + preferred);
  } catch (e) {
    toast("Couldn't list models: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "🔄 Get";
  }
}
$("fetchModelsBtn").onclick = fetchModels;

/* ---------- Chat ---------- */
const messagesEl = $("messages");
let conversation = [];
let abortCtrl = null;

function addMessage(role) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar"; avatar.textContent = role === "user" ? "You" : "🌙";
  const bubble = document.createElement("div"); bubble.className = "bubble";
  wrap.appendChild(avatar); wrap.appendChild(bubble); messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}
function appendStreaming(bubble, text) {
  bubble.innerHTML = renderMarkdown(text);
  bubble.querySelectorAll("pre code").forEach(applyHighlight);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function applyHighlight(block) {
  if (window.hljs) { try { hljs.highlightElement(block); } catch (e) {} }
  const pre = block.parentElement;
  if (pre && !pre.querySelector(".copy-btn")) {
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.textContent = "copy";
    btn.onclick = () => { navigator.clipboard.writeText(block.textContent); btn.textContent = "copied!"; setTimeout(() => (btn.textContent = "copy"), 1200); };
    pre.insertBefore(btn, pre.firstChild);
  }
}

async function sendMessage() {
  const input = $("userInput");
  const text = input.value.trim();
  if (!text) return;
  if (!$("apiKey").value) { toast("Open ⚙️ and paste your API key"); openSheet(); return; }
  if (!$("modelName").value) { toast("Open ⚙️ → 🔄 Get to pick a model"); openSheet(); return; }
  input.value = ""; input.style.height = "auto";
  addMessage("user"); conversation.push({ role: "user", content: text });

  const bubble = addMessage("bot");
  const typing = document.createElement("div");
  typing.className = "typing"; typing.innerHTML = "<span></span><span></span><span></span>";
  bubble.appendChild(typing);
  $("sendBtn").style.display = "none"; $("stopBtn").style.display = "grid";
  abortCtrl = new AbortController();

  const model = $("modelName").value;
  let full = "";
  try {
    const res = await fetch(apiBase() + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + $("apiKey").value },
      body: JSON.stringify({ model, messages: conversation, stream: true }),
      signal: abortCtrl.signal,
    });
    if (!res.ok) {
      const errTxt = await res.text();
      let msg = "HTTP " + res.status;
      try { const j = JSON.parse(errTxt); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        let line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") break;
        try {
          const obj = JSON.parse(data);
          const delta = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
          if (delta) full += delta;
        } catch (e) {}
      }
      typing.remove();
      appendStreaming(bubble, full);
    }
    conversation.push({ role: "assistant", content: full });
  } catch (e) {
    typing.remove();
    if (e.name === "AbortError") { bubble.innerHTML = "<span class='sys'>(stopped)</span>"; conversation.push({ role: "assistant", content: full }); }
    else {
      let m = e.message;
      if (m.toLowerCase().includes("failed to fetch") || m.toLowerCase().includes("networkerror"))
        m = "Network/CORS error. If your provider blocks browser requests, use a proxy or backend.";
      bubble.innerHTML = "<span class='err'>⚠️ " + m + "</span>";
    }
  } finally {
    $("sendBtn").style.display = "grid"; $("stopBtn").style.display = "none"; abortCtrl = null;
  }
}

$("sendBtn").onclick = sendMessage;
$("stopBtn").onclick = () => { if (abortCtrl) abortCtrl.abort(); };
$("userInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
$("userInput").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px"; });

/* ---------- Code runner ---------- */
const samples = {
  javascript: `// Runs in your browser (sandboxed)
console.log("Hello from MoonGPT!");
const nums = [1,2,3,4,5];
console.log("Squares:", nums.map(n => n*n));`,
  python: `# Runs via Pyodide (loads from CDN first run)
print("Hello from Python!")
nums = [1,2,3,4,5]
print("Squares:", [n*n for n in nums])`
};
function setOutput(text, cls = "") {
  const out = $("runOutput");
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = text; out.appendChild(line); out.scrollTop = out.scrollHeight;
}
function clearOutput() { $("runOutput").innerHTML = '<span class="sys">Output appears here…</span>'; }
$("langSelect").onchange = loadSample;
$("sampleBtn").onclick = loadSample;
function loadSample() { $("editor").value = samples[$("langSelect").value] || ""; }
$("clearOutBtn").onclick = clearOutput;
$("runBtn").onclick = runCode;
async function runCode() {
  const lang = $("langSelect").value;
  const code = $("editor").value;
  clearOutput();
  if (!code.trim()) { setOutput("Nothing to run.", "sys"); return; }
  if (lang === "javascript") runJS(code);
  else {
    setOutput("Loading Pyodide… (first run only)", "sys");
    try { await loadPyodideRuntime(); setOutput("Python ready:", "sys"); await runPython(code); }
    catch (e) { setOutput("Error: " + e.message, "err"); }
  }
}
function runJS(code) {
  const html = `<!DOCTYPE html><html><head></head><body><script>
    const send = (type, args) => parent.postMessage(
      { __mg: true, type, text: args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') }, '*');
    console.log = (...a) => send('log', a);
    console.error = (...a) => send('err', a);
    window.onerror = (m) => send('err', [m]);
    try { (async () => { ${code} })().catch(e => send('err', [e.message])); }
    catch (e) { send('err', [e.message]); }
  <\/script></body></html>`;
  const ifr = document.createElement("iframe");
  ifr.style.display = "none"; ifr.sandbox = "allow-scripts"; document.body.appendChild(ifr);
  ifr.srcdoc = html;
  const handler = (ev) => { if (!ev.data || !ev.data.__mg) return; setOutput(ev.data.text, ev.data.type === "err" ? "err" : ""); };
  window.addEventListener("message", handler);
  setTimeout(() => { ifr.remove(); window.removeEventListener("message", handler); }, 8000);
}
let pyodideReady = null;
function loadPyodideRuntime() {
  if (pyodideReady) return pyodideReady;
  pyodideReady = new Promise((resolve, reject) => {
    if (window.loadPyodide) return resolve(window.loadPyodide);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
    s.onload = async () => { try { window._py = await loadPyodide(); resolve(window.loadPyodide); } catch (e) { reject(e); } };
    s.onerror = () => reject(new Error("Couldn't load Pyodide (need internet on first run)"));
    document.head.appendChild(s);
  });
  return pyodideReady;
}
async function runPython(code) {
  const loadPyodide = await loadPyodideRuntime();
  const py = window._py || await loadPyodide();
  py.setStdout({ batched: (s) => setOutput(s) });
  py.setStderr({ batched: (s) => setOutput(s, "err") });
  try { await py.runPythonAsync(code); } catch (e) { setOutput(String(e), "err"); }
}

  $("userInput").value = "Here's my " + lang + " code:\n\n```" + lang + "\n" + code + "\n```\n\nWhat does it do and how can I improve it?";
  $("userInput").focus();
  showTab("chat");
};
