<!DOCTYPE html>
<html lang="en" data-theme="luxury">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HAKIMI" />
<link rel="apple-touch-icon" href="icons/icon-512.png" />
<title>HAKIMI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />

<style>
/* =========================================================================
   HAKIMI — black & white luxury chat (chat-only, Claude + OpenAI-compatible)
   No VFX, no animation, no sound. One static 3D emblem.
   ========================================================================= */

:root {
  --bg: #000000;
  --surface: #0c0c0c;
  --surface-2: #141414;
  --surface-3: #1d1d1d;
  --border: #2a2a2a;
  --text: #fafafa;
  --muted: #8c8c8c;
  --white: #ffffff;
  --danger: #e5484d;
  --ok: #cfcfcf;
  --code-bg: #070707;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Static 3D emblem (CSS cube) ---------- */
.emblem { width: 32px; height: 32px; perspective: 220px; flex-shrink: 0; }
.emblem.lg { width: 96px; height: 96px; margin: 0 auto; }
.cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(34deg); }
.cube .face { position: absolute; width: 100%; height: 100%; border: 1px solid #555; background: linear-gradient(135deg, #3a3a3a, #161616); }
.cube .f-front  { transform: translateZ(16px); }
.cube .f-back   { transform: rotateY(180deg) translateZ(16px); background: linear-gradient(135deg,#1a1a1a,#0c0c0c); }
.cube .f-right  { transform: rotateY(90deg) translateZ(16px); background: linear-gradient(135deg,#333,#1c1c1c); }
.cube .f-left   { transform: rotateY(-90deg) translateZ(16px); background: linear-gradient(135deg,#242424,#101010); }
.cube .f-top    { transform: rotateX(90deg) translateZ(16px); background: linear-gradient(135deg,#4a4a4a,#2a2a2a); }
.cube .f-bottom { transform: rotateX(-90deg) translateZ(16px); background: linear-gradient(135deg,#121212,#060606); }
.emblem.lg .cube .f-front  { transform: translateZ(48px); }
.emblem.lg .cube .f-back   { transform: rotateY(180deg) translateZ(48px); }
.emblem.lg .cube .f-right  { transform: rotateY(90deg) translateZ(48px); }
.emblem.lg .cube .f-left   { transform: rotateY(-90deg) translateZ(48px); }
.emblem.lg .cube .f-top    { transform: rotateX(90deg) translateZ(48px); }
.emblem.lg .cube .f-bottom { transform: rotateX(-90deg) translateZ(48px); }

/* ---------- App shell ---------- */
#app { height: 100vh; height: 100dvh; height: 100svh; display: flex; flex-direction: column; }

/* ---------- Header ---------- */
header {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top));
  background: #000; border-bottom: 1px solid var(--border);
}
header h1 {
  font-size: 19px; margin: 0; font-weight: 500; letter-spacing: 5px;
  font-family: "Georgia", "Times New Roman", serif; text-transform: uppercase;
}
.spacer { flex: 1; }
#status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
#status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); }
#status.ok::before { background: var(--ok); }
#ownerBadge { display: none; font-size: 10px; letter-spacing: 2px; color: var(--text); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; background: var(--surface-2); text-transform: uppercase; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
  background: transparent; color: var(--text); font-size: 17px; display: grid; place-items: center;
}
.icon-btn:active { background: var(--surface-2); }

/* ---------- Chat ---------- */
#screens { flex: 1; position: relative; min-height: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }

/* ---------- Welcome ---------- */
#welcome {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; justify-content: safe center; gap: 26px; padding: 30px; text-align: center; z-index: 5;
  overflow-y: auto; pointer-events: none;
}
#welcome .sug { pointer-events: auto; }
#welcome .big {
  font-size: 48px; font-weight: 500; letter-spacing: 8px; margin: 10px 0 0;
  font-family: "Georgia", "Times New Roman", serif; text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff, #8c8c8c); -webkit-background-clip: text; background-clip: text; color: transparent;
}
#welcome .tagline { color: var(--muted); max-width: 360px; line-height: 1.8; font-size: 14px; letter-spacing: .3px; }
#welcome .sugs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 380px; }
@media (max-height: 720px) {
  #welcome { gap: 16px; padding: 20px; }
  #welcome .big { font-size: 36px; letter-spacing: 6px; }
  #welcome .tagline { font-size: 13px; }
  .sug { padding: 9px 14px; font-size: 12px; }
}
.sug {
  border: 1px solid var(--border); background: transparent; color: var(--text);
  border-radius: 22px; padding: 11px 17px; font-size: 13px; letter-spacing: .3px;
}
.sug:active { background: var(--surface-2); }

/* ---------- Messages ---------- */
#messages { flex: 1; overflow-y: auto; padding: 22px 16px 12px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
.msg { display: flex; gap: 12px; align-items: flex-end; max-width: 100%; }
.msg.user { flex-direction: row-reverse; }
.msg .avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  font-size: 11px; font-weight: 500; letter-spacing: .5px; border: 1px solid var(--border);
}
.msg.bot .avatar { background: var(--surface-2); color: var(--text); }
.msg.user .avatar { background: #fff; color: #000; }
.bubble {
  max-width: 78%; padding: 14px 17px; border-radius: 20px; line-height: 1.7; font-size: 15px;
  overflow-x: auto; word-wrap: break-word; border: 1px solid var(--border);
}
.msg.bot .bubble { background: var(--surface-2); border-bottom-left-radius: 5px; }
.msg.user .bubble { background: #fff; color: #000; border-bottom-right-radius: 5px; }
.bubble pre { margin: 12px 0; }
.bubble code { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
.bubble :not(pre) > code { background: rgba(255,255,255,.12); padding: 2px 6px; border-radius: 6px; }
.msg.bot .bubble :not(pre) > code { background: rgba(0,0,0,.4); }
.bubble pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow-x: auto; }
.bubble pre code { background: none; padding: 0; }
.bubble .err { color: #ff9a9a; }
.bubble .sys { color: var(--muted); font-style: italic; }
.copy-btn { float: right; margin: -4px -4px 8px 8px; font-size: 10px; padding: 3px 8px; background: var(--surface-3); border: 1px solid var(--border); color: var(--muted); border-radius: 7px; }
.bubble img.gen { max-width: 100%; border-radius: 12px; display: block; margin-top: 4px; }
.img-dl { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--text); border: 1px solid var(--border); background: var(--surface-3); padding: 8px 14px; border-radius: 10px; text-decoration: none; letter-spacing: .5px; }
/* round tool-button style removed — tools now use .tool pills */
/* old .on style removed — see .tool.on */
#micBtn.listening { background: var(--danger); border-color: var(--danger); color: #fff; }
.replay-btn { float: right; margin: -6px -8px 6px 6px; font-size: 13px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 3px 8px; }
.replay-btn:active { background: var(--surface-3); color: var(--text); }
.typing { display: inline-flex; gap: 5px; padding: 8px 2px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }

/* ---------- Composer ---------- */
#composer {
  display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  background: #000; border-top: 1px solid var(--border);
}
#composerRow { display: flex; gap: 12px; align-items: flex-end; }
.toolbar { display: flex; gap: 8px; }
.tool {
  flex: 1; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 14px; padding: 9px 4px; font-size: 13px; letter-spacing: .3px; white-space: nowrap;
}
.tool:active { background: var(--surface-3); }
.tool.on { background: #fff; color: #000; border-color: #fff; }
#attachBar { display: none; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 8px 12px 8px 8px; }
#attachBar.show { display: flex; }
#attachBar .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.attach-name { flex: 1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-x { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 12px; }
.bubble img.attached { max-width: 100%; border-radius: 12px; display: block; margin-bottom: 8px; }
#userInput {
  flex: 1; resize: none; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 24px; padding: 15px 20px;
  font-size: 16px; line-height: 1.45; max-height: 130px; min-height: 50px;
}
#userInput:focus { outline: none; border-color: var(--white); }
.send, .stop {
  width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 20px;
}
.send { background: #fff; color: #000; }
.stop { background: var(--surface-2); color: var(--text); font-size: 13px; }
.send:active, .stop:active { background: var(--surface-3); }

/* ---------- Settings sheet ---------- */
#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.65); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 80; }
#backdrop.open { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
  border-radius: 24px 24px 0 0; padding: 10px 22px calc(26px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .3s ease; z-index: 90;
  max-height: 92dvh; overflow-y: auto; border-top: 1px solid var(--border);
  box-shadow: 0 -24px 70px -24px rgba(255,255,255,.1);
}
#sheet.open { transform: translateY(0); }
.handle { width: 48px; height: 5px; border-radius: 5px; background: var(--border); margin: 10px auto 20px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sheet-head h2 { font-size: 18px; margin: 0; font-family: "Georgia", serif; letter-spacing: 2px; text-transform: uppercase; }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.field label { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.field input, .field select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; font-size: 15px; width: 100%; }
.field input:focus, .field select:focus { outline: none; border-color: var(--white); }
.model-row { display: flex; gap: 10px; }
.model-row input { flex: 1; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.8; margin: 0 0 14px; letter-spacing: .2px; }
.pill-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 12px; padding: 11px 15px; font-size: 14px; }
.pill-btn:active { background: var(--surface-3); }
.pill-btn.danger { border-color: var(--danger); color: #ff9a9a; }

/* ---------- Call overlay ---------- */
#callOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 120; background: rgba(0,0,0,.92); padding: 24px; }
#callOverlay.open { display: flex; }
.call-card { width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.call-title { font-family: "Georgia", serif; letter-spacing: 6px; font-size: 15px; color: var(--muted); }
#callStatus { font-size: 17px; letter-spacing: .5px; }
#callTranscript { font-size: 14px; color: var(--muted); line-height: 1.7; min-height: 48px; max-height: 140px; overflow-y: auto; }
.call-actions { display: flex; gap: 10px; width: 100%; margin-top: 8px; }
.call-actions button { flex: 1; padding: 16px; border-radius: 16px; font-size: 15px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
#endCallBtn { background: var(--danger); border-color: var(--danger); color: #fff; }

/* ---------- Chat history drawer ---------- */
#drawerBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 94; }
#drawerBackdrop.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 84vw); z-index: 95;
  background: var(--surface); border-right: 1px solid var(--border);
  transform: translateX(-105%); transition: transform .25s ease;
  display: flex; flex-direction: column; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
}
#drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.drawer-head h2 { font-size: 16px; margin: 0; font-family: "Georgia", serif; letter-spacing: 2px; text-transform: uppercase; }
#newChatBtn { border: 1px solid var(--border); background: #fff; color: #000; border-radius: 13px; padding: 13px; font-size: 14px; margin-bottom: 14px; }
#newChatBtn:active { background: var(--surface-3); color: var(--text); }
#chatList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.drawer-empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 20px; }
.chat-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 13px; padding: 12px 8px 12px 14px; font-size: 14px; }
.chat-item.active { border-color: var(--white); }
.chat-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-del { width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--muted); font-size: 12px; flex-shrink: 0; }
.chat-del:active { color: var(--danger); }
.drawer-note { color: var(--muted); font-size: 11px; text-align: center; margin: 12px 0 0; letter-spacing: .4px; }

/* ---------- Confirm modal ---------- */
#confirm { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 95; background: rgba(0,0,0,.65); }
#confirm.open { display: flex; }
.confirm-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 26px; width: 86%; max-width: 320px; text-align: center; }
.confirm-card h3 { margin: 0 0 10px; font-size: 17px; font-family: "Georgia", serif; letter-spacing: 1px; }
.confirm-card p { color: var(--muted); font-size: 14px; margin: 0 0 22px; line-height: 1.7; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions button { flex: 1; padding: 14px; border-radius: 13px; font-size: 14px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.confirm-actions .danger { background: var(--danger); border-color: var(--danger); color: #fff; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
  background: var(--surface-3); border: 1px solid var(--border); color: var(--text);
  padding: 14px 20px; border-radius: 14px; font-size: 14px; opacity: 0;
  transition: opacity .25s; pointer-events: none; z-index: 130; max-width: 90%; text-align: center; letter-spacing: .3px;
}
.toast.show { opacity: 1; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn" title="Chats">&#9776;</button>
    <div class="emblem"><div class="cube">
      <div class="face f-front"></div><div class="face f-back"></div>
      <div class="face f-right"></div><div class="face f-left"></div>
      <div class="face f-top"></div><div class="face f-bottom"></div>
    </div></div>
    <h1>HAKIMI</h1>
    <div class="spacer"></div>
    <span id="ownerBadge">Owner</span>
    <span id="status">Free</span>
    <button class="icon-btn" id="gearBtn" title="Settings">&#9881;</button>
  </header>

  <div id="screens">
    <section class="screen active" id="chatScreen">
      <div id="welcome">
        <div class="emblem lg"><div class="cube">
          <div class="face f-front"></div><div class="face f-back"></div>
          <div class="face f-right"></div><div class="face f-left"></div>
          <div class="face f-top"></div><div class="face f-bottom"></div>
        </div></div>
        <div class="big">HAKIMI</div>
        <p class="tagline">Your private AI. Converse in any language, with clarity and restraint.</p>
        <div class="sugs" id="sugs"></div>
      </div>
      <div id="messages"></div>
    </section>
  </div>
  <div id="composer">
    <div id="attachBar"><img class="thumb" id="attachThumb" alt="attached photo" /><span class="attach-name" id="attachName"></span><button class="attach-x" id="attachClear" title="Remove photo">&#10005;</button></div>
    <div id="composerRow">
      <textarea id="userInput" placeholder="Message HAKIMI" rows="1"></textarea>
      <button class="send" id="sendBtn">&#8594;</button>
      <button class="stop" id="stopBtn" style="display:none;">&#9632;</button>
    </div>
    <div class="toolbar">
      <button class="tool" id="imgBtn" title="Toggle image mode">🎨 Image</button>
      <button class="tool" id="micBtn" title="Voice call">📞 Call</button>
      <button class="tool" id="speakBtn" title="Read replies aloud">🔊 Read</button>
      <button class="tool" id="attachBtn" title="Attach a photo">📎 Photo</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden />
</div>

<!-- Call overlay -->
<div id="callOverlay">
  <div class="call-card">
    <div class="emblem lg"><div class="cube">
      <div class="face f-front"></div><div class="face f-back"></div>
      <div class="face f-right"></div><div class="face f-left"></div>
      <div class="face f-top"></div><div class="face f-bottom"></div>
    </div></div>
    <div class="call-title">HAKIMI CALL</div>
    <div id="callStatus">Listening…</div>
    <div id="callTranscript"></div>
    <div class="call-actions">
      <button id="interruptBtn">Tap to interrupt</button>
      <button id="endCallBtn">End call</button>
    </div>
  </div>
</div>

<!-- Chat history drawer -->
<div id="drawerBackdrop"></div>
<aside id="drawer">
  <div class="drawer-head">
    <h2>Chats</h2>
    <button class="icon-btn" id="closeDrawer">&#10005;</button>
  </div>
  <button id="newChatBtn">+ New chat</button>
  <div id="chatList"></div>
  <p class="drawer-note">Chats auto-save in this browser.</p>
</aside>

<!-- Settings sheet -->
<div id="backdrop"></div>
<div id="sheet">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2>Settings</h2>
    <button class="icon-btn" id="closeSheet">&#10005;</button>
  </div>

  <div class="field">
    <label>Provider</label>
    <select id="provider">
      <option value="pollinations">Free Forever (no key, no sign-in)</option>
      <option value="puter">Puter (Claude quality, uses credits)</option>
      <option value="anthropic">Claude (Anthropic)</option>
      <option value="groq">Groq (free)</option>
      <option value="openai">OpenAI</option>
      <option value="openrouter">OpenRouter</option>
      <option value="custom">Custom (OpenAI-compatible)</option>
    </select>
  </div>

  <div class="field" id="keyField">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="paste your key" autocomplete="off" />
  </div>

  <div class="field">
    <label>Owner name</label>
    <input id="ownerName" placeholder="e.g. Alex — the owner" autocomplete="off" />
  </div>

  <div class="field">
    <label>Model</label>
    <div class="model-row">
      <input id="modelName" list="modelList" placeholder="tap Get" autocomplete="off" />
      <button class="pill-btn" id="fetchModelsBtn" type="button">Get</button>
    </div>
    <datalist id="modelList">
      <option value="claude-opus-4-6"></option>
      <option value="claude-opus-4-5"></option>
      <option value="claude-sonnet-5"></option>
      <option value="claude-opus-5-5"></option>
      <option value="claude-haiku-4-5"></option>
      <option value="claude-sonnet-4-5"></option>
      <option value="llama-4-scout-17b-16e-instruct"></option>
      <option value="gpt-4o-mini"></option>
    </datalist>
  </div>

  <div class="field" id="imgModelField">
    <label>Image model (free, Puter only)</label>
    <select id="imgModel">
      <option value="gpt-image-2.5-flare">GPT Image 2.5 Flare (recommended)</option>
      <option value="gpt-image-2.5-sunburst">GPT Image 2.5 Sunburst</option>

  "Match the user's energy: casual when they're casual, serious when they're serious, funny when they're joking. Never be stiff, " +

function detectScript(text) {
  const tests = [
    ["ar", /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/],
    ["he", /[\u0590-\u05FF]/],
    ["ru", /[\u0400-\u04FF]/],
    ["hi", /[\u0900-\u097F]/],
    ["zh", /[\u4E00-\u9FFF\u3400-\u4DBF]/],
    ["ja", /[\u3040-\u30FF]/],
    ["ko", /[\uAC00-\uD7AF]/]
  ];
  for (const [code, re] of tests) { if (re.test(text)) return code; }
  return "en";
}
const RTL_LANGS = new Set(["ar", "he", "fa", "ur"]);

 try {

 } catch (e) {}

/* ---------- Settings sheet ---------- */

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {

  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ---------- Confirm modal ---------- */
function confirmDialog(title, text, onOk) {
  $("confirmTitle").textContent = title;
  $("confirmText").textContent = text;
  $("confirm").classList.add("open");
  const ok = $("confirmOk"), cancel = $("confirmCancel");
  const cleanup = () => { $("confirm").classList.remove("open"); ok.onclick = null; cancel.onclick = null; };
  ok.onclick = () => { cleanup(); onOk(); };

/* ---------- Markdown ---------- */
function renderMarkdown(text) {
  if (window.marked) { marked.setOptions({ breaks: true, gfm: true }); return marked.parse(text); }
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>");
}
function sanitizeRendered(root) {
  root.querySelectorAll("a").forEach(a => {
    const href = (a.getAttribute("href") || "").trim().toLowerCase();
    if (!href.startsWith("http://") && !href.startsWith("https://") && !href.startsWith("mailto:")) {
      a.removeAttribute("href");
    } else {
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    }
  });
  root.querySelectorAll("img").forEach(im => {
    const src = (im.getAttribute("src") || "").trim().toLowerCase();
    if (!src.startsWith("http://") && !src.startsWith("https://") && !src.startsWith("data:image/")) im.remove();
  });
  root.querySelectorAll("script, iframe, object, embed, form").forEach(n => n.remove());
}

/* ---------- Fetch models (FIX: Puter needs NO key — check it FIRST) ---------- */
async function fetchModels() {
  const btn = $("fetchModelsBtn"); btn.disabled = true; btn.textContent = "…";
  // Puter branch FIRST — no API key required
  if ($("provider").value === "puter") {
    const ids = PUTER_MODELS;
    $("modelList").innerHTML = ids.map(id => '<option value="' + id + '"></option>').join("");
    const cur = $("modelName").value;
    if (!cur || !ids.includes(cur)) $("modelName").value = ids[0];
    saveSettings();
    toast("Claude models loaded — using " + $("modelName").value);
    btn.disabled = false; btn.textContent = "Get";
    return;
  }
  // Other providers DO need a key
  const _fcfg = PROVIDERS[$("provider").value] || {};
  if (!_fcfg.free && !$("apiKey").value) { toast("Enter your API key first"); openSheet(); btn.disabled = false; btn.textContent = "Get"; return; }
  try {
    const res = await fetch(modelsUrl(), { headers: authHeaders() });
    if (!res.ok) {
      let msg = "HTTP " + res.status;
      if (res.status === 401) msg = "API key rejected (401) — check your key is correct";
      else if (res.status === 403) msg = "Forbidden (403) — key may lack model access";
      throw new Error(msg);
    }
    const j = await res.json();
    const _arr = Array.isArray(j) ? j : (j.data || []);
    const ids = _arr.map(m => (typeof m === "string" ? m : (m.id || m.name))).filter(Boolean);
    if (!ids.length) throw new Error("no models returned");
    $("modelList").innerHTML = ids.map(id => '<option value="' + id + '"></option>').join("");
    const cur = $("modelName").value;
    const preferred =
      ids.find(id => /claude-sonnet|claude-3|llama-4-scout|gpt-4o|llama-3\.1-8b/i.test(id)) ||
      ids.find(id => !/qwen3\.8|deepseek-r1/i.test(id)) ||
      ids[0];
    if (!cur || !ids.includes(cur)) $("modelName").value = preferred;
    saveSettings();
    toast("Models loaded — using " + $("modelName").value);
  } catch (e) {
    if ($("provider").value === "pollinations") {
      const ids = ["openai", "openai-fast", "mistral", "llama"];
      $("modelList").innerHTML = ids.map(id => '<option value="' + id + '"></option>').join("");
      if (!ids.includes($("modelName").value)) $("modelName").value = ids[0];
      saveSettings();
      toast("Using free models — " + $("modelName").value);
    } else {
      toast("Couldn't list models: " + e.message);
    }
  } finally {
    btn.disabled = false; btn.textContent = "Get";
  }
}
$("fetchModelsBtn").onclick = fetchModels;

/* ---------- Chat ---------- */
const messagesEl = $("messages");
let conversation = [];
let abortCtrl = null;
let welcomeHidden = false;

/* ---------- Saved chats (auto-saved in this browser) ---------- */
let chats = [];
let currentChatId = null;
try {
  const raw = JSON.parse(localStorage.getItem("lm_chats") || "[]");
  chats = Array.isArray(raw) ? raw.filter(c => c && typeof c.id === "string" && Array.isArray(c.messages)) : [];
  chats.forEach(c => {
    if (typeof c.title !== "string") c.title = "New chat";
    if (typeof c.updatedAt !== "number") c.updatedAt = Date.now();
    c.messages = c.messages.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string");
  });
} catch (e) { chats = []; }

function persistChats() {
  try {
    const slim = chats.slice(0, 30).map(c => ({
      id: c.id, title: c.title, updatedAt: c.updatedAt,
      messages: (c.messages || []).slice(-60).map(m => ({ role: m.role, content: m.content }))
    }));
    localStorage.setItem("lm_chats", JSON.stringify(slim));
  } catch (e) {}
}
function apiMessages() {
  return conversation.filter(m => m && m.content).map(m => ({ role: m.role, content: m.content }));
}
function currentChat() { return chats.find(c => c.id === currentChatId) || null; }
function newChat() {
  endCall(true); stopSpeaking();
  const c = { id: "c" + Date.now().toString(36), title: "New chat", messages: [], updatedAt: Date.now() };
  chats.unshift(c);
  currentChatId = c.id;
  conversation = c.messages;
  messagesEl.innerHTML = "";
  welcomeHidden = false;
  $("welcome").style.display = "flex";
  persistChats(); renderChatList();
  closeDrawer();
}
function saveCurrentChat() {
  const c = currentChat();
  if (!c) return;
  c.messages = conversation;
  c.updatedAt = Date.now();
  const first = (conversation.find(m => m.role === "user") || {}).content || "";
  if (first) c.title = first.replace(/🎨\s*/g, "").slice(0, 34) + (first.length > 34 ? "…" : "");
  persistChats(); renderChatList();
}
function loadChat(id) {
  const c = chats.find(x => x.id === id);
  if (!c) return;
  endCall(true); stopSpeaking();
  currentChatId = id;
  conversation = c.messages || [];
  c.messages = conversation;
  messagesEl.innerHTML = "";
  if (!conversation.length) {
    welcomeHidden = false;
    $("welcome").style.display = "flex";
  } else {
    welcomeHidden = true;
    $("welcome").style.display = "none";
    conversation.forEach(m => {
      const b = addMessage(m.role === "user" ? "user" : "bot");
      if (m.role === "user") {
        if (m.img) {
          b.innerHTML = "";
          const th = document.createElement("img");
          th.className = "attached"; th.src = m.img; th.alt = "photo";
          b.appendChild(th);
          const cap = document.createElement("div");
          cap.textContent = m.content;
          b.appendChild(cap);
        } else { b.textContent = m.content; }
      } else { appendStreaming(b, m.content); }
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  renderChatList();
  closeDrawer();
}
function deleteChat(id, ev) {
  if (ev) ev.stopPropagation();
  confirmDialog("Delete this chat?", "It will be removed from this browser.", () => {
    chats = chats.filter(c => c.id !== id);
    if (currentChatId === id) {
      if (!chats.length) { newChat(); return; }
      loadChat(chats[0].id);
      return;
    }
    persistChats(); renderChatList();
  });
}
function renderChatList() {
  const list = $("chatList");
  list.innerHTML = "";
  if (!chats.length) { list.innerHTML = "<p class='drawer-empty'>No chats yet.</p>"; return; }
  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === currentChatId ? " active" : "");
    const t = document.createElement("span");
    t.className = "chat-title"; t.textContent = c.title || "New chat";
    const del = document.createElement("button");
    del.className = "chat-del"; del.textContent = "✕"; del.title = "Delete";
    del.onclick = (ev) => deleteChat(c.id, ev);
    item.onclick = () => loadChat(c.id);
    item.appendChild(t); item.appendChild(del);
    list.appendChild(item);
  });
}
function openDrawer() { $("drawerBackdrop").classList.add("open"); $("drawer").classList.add("open"); }
function closeDrawer() { $("drawerBackdrop").classList.remove("open"); $("drawer").classList.remove("open"); }
$("menuBtn").onclick = openDrawer;
$("closeDrawer").onclick = closeDrawer;
$("drawerBackdrop").onclick = closeDrawer;

function hideWelcome() {
  if (welcomeHidden) return;
  welcomeHidden = true;
  $("welcome").style.display = "none";
}

function addMessage(role) {
  hideWelcome();
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar"; avatar.textContent = role === "user" ? "You" : "H";
  const bubble = document.createElement("div"); bubble.className = "bubble";
  wrap.appendChild(avatar); wrap.appendChild(bubble); messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}
function appendStreaming(bubble, text) {
  bubble._rawText = text;
  bubble.innerHTML = renderMarkdown(text);
  sanitizeRendered(bubble);
  bubble.querySelectorAll("pre code").forEach(applyHighlight);
  ensureReplay(bubble);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function ensureReplay(bubble) {
  if (bubble.querySelector(".replay-btn")) return;
  const rp = document.createElement("button");
  rp.className = "replay-btn"; rp.title = "Read aloud"; rp.textContent = "🔊";
  rp.onclick = (ev) => {
    ev.stopPropagation();
    const raw = bubble._rawText || "";
    if (!raw.trim()) return;
    speakText(raw, null);
  };
  bubble.insertBefore(rp, bubble.firstChild);
}
function applyHighlight(block) {
  if (window.hljs) { try { hljs.highlightElement(block); } catch (e) {} }
  const pre = block.parentElement;
  if (pre && !pre.querySelector(".copy-btn")) {
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.textContent = "copy";
    btn.onclick = () => { navigator.clipboard.writeText(block.textContent); btn.textContent = "copied!"; setTimeout(() => (btn.textContent = "copy"), 1200); };
    pre.insertBefore(btn, pre.firstChild);
  }
}

async function sendMessage(textOverride) {
  const input = $("userInput");
  const text = (textOverride != null ? textOverride : input.value).trim();
  if (!text && !pendingImage) return;
  stopSpeaking();
  if (pendingImage && !imageMode) {
    const img = pendingImage;
    clearAttachment();
    if (textOverride == null) { input.value = ""; input.style.height = "auto"; }
    sendVision(text, img);
    return;
  }
  if (imageMode) {
    if (textOverride == null) { input.value = ""; input.style.height = "auto"; }
    generateImage(text);
    return;
  }
  const _pcfg = PROVIDERS[$("provider").value] || {};
  if (!_pcfg.free && !$("apiKey").value) { toast("Open settings and paste your API key"); openSheet(); return; }
  if (!$("modelName").value) {
    const _def = PROVIDERS[$("provider").value] || {};
    if (_def.model) { $("modelName").value = _def.model; saveSettings(); }
    else { toast("Open settings → Get to pick a model"); openSheet(); return; }
  }
  if (textOverride == null) { input.value = ""; input.style.height = "auto"; }
  const userBubble = addMessage("user"); conversation.push({ role: "user", content: text });
  const detected = detectScript(text);
  userBubble.parentElement.dir = RTL_LANGS.has(detected) ? "rtl" : "ltr";

  const bubble = addMessage("bot");
  bubble.parentElement.dir = RTL_LANGS.has(detected) ? "rtl" : "ltr";
  const typing = document.createElement("div");
  typing.className = "typing"; typing.innerHTML = "<span></span><span></span><span></span>";
  bubble.appendChild(typing);
  $("sendBtn").style.display = "none"; $("stopBtn").style.display = "grid";
  abortCtrl = new AbortController();

  const providerKey = $("provider").value;
  const prov = PROVIDERS[providerKey] || PROVIDERS.puter; // FIX: safe fallback
  const model = $("modelName").value;
  const langPref = $("replyLang").value;
  const maxTok = Math.max(500, Math.min(16000, parseInt($("maxTokens").value, 10) || 6000));
  const outTok = $("provider").value === "pollinations" ? Math.min(maxTok, 2000) : maxTok;
  let sysText = SYSTEM_PROMPT;
  if (langPref === "auto") {
    if (detected !== "en") sysText += " The user is writing in " + detected + "; reply in that language.";
  } else {
    sysText += " Reply in " + langPref + ".";
  }

  let full = "";
  try {
    if (prov.kind === "puter") {
      if (typeof puter === "undefined" || !puter.ai) throw new Error("Puter.js didn't load — check your connection");
      const messages = [{ role: "system", content: sysText }].concat(apiMessages());
      const resp = await puter.ai.chat(messages, { model: model, stream: true });
      for await (const part of resp) {
        if (part && part.text) full += part.text;
        if (typing.parentElement) typing.remove();
        appendStreaming(bubble, full);
      }
    } else {
      const __freeChat = (providerKey === "pollinations" && prov.kind === "openai");
      const __models = __freeChat
        ? [model, "openai", "openai-fast", "mistral"].filter((v, i, a) => v && a.indexOf(v) === i)
        : [model];
      let res = null;
      for (const __tm of __models) {
        try {
          if (prov.kind === "anthropic") {
            res = await fetch(prov.base + "/messages", {
              method: "POST",
              headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
              body: JSON.stringify({ model: model, max_tokens: maxTok, system: sysText, messages: apiMessages(), stream: true }),
              signal: abortCtrl.signal,
            });
          } else {
            const payload = [{ role: "system", content: sysText }].concat(apiMessages());
            res = await fetch(chatUrl(), {
              method: "POST",
              headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
              body: JSON.stringify({ model: __tm, messages: payload, stream: true, max_tokens: outTok, temperature: 0.85 }),
              signal: abortCtrl.signal,
            });
          }
          if (!res.ok) {
            if (res.status === 429 && $("provider").value === "pollinations") throw new Error("Free server is busy (1 msg per ~15s) — wait a few seconds and resend");

            let msg = "HTTP " + res.status;
            try {
              const j = JSON.parse(errTxt);
              if (j.error && j.error.message) msg = j.error.message;

          break;
        } catch (fe) {

          const retryable = __freeChat && !lastOne &&
            ((fe.__status && [400, 402, 403, 404, 422].indexOf(fe.__status) >= 0) ||
             /model|tier|anonymous|not found|not available|payment|credit|quota|disabled|unavailable|overloaded/i.test(fe.message || ""));
          if (!retryable) throw fe;
          res = null;
        }

      if (!res) throw new Error("Free server failed — try again in a bit");
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf("\n")) >= 0) {
          let line = buffer.slice(0, nl).trim();
          buffer = buffer.slice(nl + 1);
          if (!line.startsWith("data:")) continue;

    if (typing.parentElement) typing.remove();
    if (e.name === "AbortError") {
      bubble.innerHTML = "<span class='sys'>(stopped)</span>"; conversation.push({ role: "assistant", content: full }); saveCurrentChat();
    } else {
      if (conversation.length && conversation[conversation.length - 1].role === "user") conversation.pop();

      let m = e.message || "Unknown error";

      } else if (low.includes("failed to fetch") || low.includes("networkerror") || low.includes("cors")) {

  }
}

/* ---------- Voice mode (free, built into your browser — no key) ---------- */
const SPEECH_LANGS = { en: "en-US", es: "es-ES", fr: "fr-FR", ar: "ar-SA", zh: "zh-CN", hi: "hi-IN", ru: "ru-RU", pt: "pt-BR", de: "de-DE", ja: "ja-JP", ko: "ko-KR", he: "he-IL" };
function speechLangFor(detected) {
  const pref = $("replyLang").value;
  const code = (pref && pref !== "auto") ? pref : (detected || "en");
  return SPEECH_LANGS[code] || "en-US";
}

function cleanForSpeech(text) {
  if (!text) return "";
  return text
    .replace(/```[\s\S]*?```/g, " code snippet. ")
    .replace(/`([^`]*)`/g, "$1")
    .replace(/!\[([^\]]*)\]\([^)]+\)/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/^>\s?/gm, "")
    .replace(/(\*\*|__)(.*?)\1/g, "$2")
    .replace(/(\*|_)(.*?)\1/g, "$2")
    .replace(/~~(.*?)~~/g, "$1")
    .replace(/[*_~`>#|]/g, "")
    .replace(/https?:\/\/\S+/g, "link")
    .replace(/[{}[\]()]/g, "")
    .replace(/\s+/g, " ")
    .replace(/\s+([.,!?;:])/g, "$1")
    .trim()
    .slice(0, 1200);
}

function stopSpeaking() {
  try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
}

function isAutoRead() { return $("autoRead").value === "on"; }

/* ---------- Voice picker: best natural (prefer male) voice ---------- */
let cachedVoice = null;
function pickVoice(lang) {
  try {
    if (!("speechSynthesis" in window)) return null;
    const vs = speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    const want = (lang || "en-US").toLowerCase().split("-")[0];
    const pool = vs.filter(v => (v.lang || "").toLowerCase().split("-")[0] === want);
    const list = pool.length ? pool : vs;
    const maleHints = ["male", "daniel", "aaron", "david", "alex", "fred", "george", "james", "john", "mike", "paul", "thomas", "guy", "mark", "ryan", "oliver"];
    const naturalHints = ["google", "neural", "natural", "premium", "enhanced", "siri", "online"];
    const score = (v) => {
      const n = ((v.name || "") + " " + (v.voiceURI || "")).toLowerCase();
      let s = 0;
      if (maleHints.some(h => n.includes(h))) s += 10;
      if (naturalHints.some(h => n.includes(h))) s += 5;
      if (v.localService) s += 2;
      if ((v.lang || "").toLowerCase() === (lang || "").toLowerCase()) s += 3;
      return s;
    };
    list.sort((a, b) => score(b) - score(a));
    return list[0] || null;
  } catch (e) { return null; }
}
function voiceFor(lang) {
  if (!cachedVoice) cachedVoice = pickVoice(lang);
  if (cachedVoice && (cachedVoice.lang || "").split("-")[0].toLowerCase() !== (lang || "en").split("-")[0].toLowerCase()) {
    cachedVoice = pickVoice(lang);
  }
  return cachedVoice;
}
try {
  if ("speechSynthesis" in window) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => { cachedVoice = null; try { speechSynthesis.getVoices(); } catch (e) {} };
  }
} catch (e) {}

function speakText(text, detected, onend) {
  if (!("speechSynthesis" in window)) { toast("This browser can't read aloud — try Chrome or Safari"); return; }
  stopSpeaking();
  const clean = cleanForSpeech(text);
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = speechLangFor(detected);
  const rate = parseFloat($("voiceRate").value || "1");
  u.rate = isNaN(rate) ? 1 : rate;
  u.pitch = 0.95;
  try { const vv = voiceFor(u.lang); if (vv) u.voice = vv; } catch (e2) {}
  if (onend) { u.onend = onend; u.onerror = onend; }
  try { speechSynthesis.speak(u); } catch (e) {}
}

/* ---------- Call mode: live voice conversation ---------- */
let callActive = false;
let callRecog = null;
let callThinking = false;
let callGen = 0;
let callListenGen = 0;
let callSilence = 0;

function setCallStatus(t) { const el = $("callStatus"); if (el) el.textContent = t; }
function setCallTranscript(t) { const el = $("callTranscript"); if (el) el.textContent = t; }

function speakChunk(text, detected, onend) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = speechLangFor(detected);
    const rate = parseFloat(($("voiceRate") || {}).value || "1");
    u.rate = isNaN(rate) ? 1 : rate;
    u.pitch = 0.95;
    try { const vv2 = voiceFor(u.lang); if (vv2) u.voice = vv2; } catch (e2) {}
    if (onend) { u.onend = onend; u.onerror = onend; }

  } catch (e) { if (onend) onend(); }
}
function pullSentences(buf) {
  const out = [];
  const re = /[^.!?。！？]+[.!?。！？]+/g;
  let m, last = 0;
  while ((m = re.exec(buf)) !== null) { out.push(m[0].trim()); last = m.index + m[0].length; }
  return { sentences: out.filter(s => s.length > 1), rest: buf.slice(last) };
}

function startCall() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Live calls need Chrome, Edge, or Safari"); return; }
  if (!("speechSynthesis" in window)) { toast("This browser can't speak — try Chrome or Safari"); return; }
  if (callActive) return;
  const _ccfg = PROVIDERS[$("provider").value] || {};
  if (!_ccfg.free && !$("apiKey").value) { toast("Open settings and paste your API key"); openSheet(); return; }
  if ($("provider").value === "puter" && (typeof puter === "undefined" || !puter.ai)) { toast("Puter.js didn't load — check your connection"); return; }
  if (imageMode) {
    imageMode = false;
    $("imgBtn").classList.remove("on");
    $("userInput").placeholder = "Message HAKIMI";

  stopSpeaking();
  callActive = true;
  callThinking = false;
  callGen++;
  $("callOverlay").classList.add("open");
  $("micBtn").classList.add("on");
  setCallStatus("Listening…");
  setCallTranscript("Say something — I'm listening.");
  callListen();
}

function endCall(silent) {
  if (!callActive) return;
  callActive = false;
  callThinking = false;
  callGen++;
  try { if (callRecog) callRecog.abort(); } catch (e) {}
  try { if (abortCtrl) abortCtrl.abort(); } catch (e) {}
  abortCtrl = null;
  callRecog = null;
  stopSpeaking();
  $("callOverlay").classList.remove("open");
  $("micBtn").classList.remove("on");

function callListen() {
  if (!callActive || callThinking) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { endCall(true); toast("Voice input needs Chrome, Edge, or Safari"); return; }
  try { if (callRecog) callRecog.abort(); } catch (e) {}
  const myLG = ++callListenGen;
  const r = new SR();
  callRecog = r;
  r.lang = speechLangFor(null);
  r.interimResults = true;
  r.continuous = false;
  r.maxAlternatives = 1;
  setCallStatus(callSilence >= 3 ? "Still listening… (say something!)" : "Listening…");
  let gotFinal = false;
  r.onresult = (ev) => {
    if (myLG !== callListenGen || !callActive) return;
    let interim = "", fin = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) fin += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    if (interim) { callSilence = 0; setCallTranscript("You: " + interim); }
    if (fin && !gotFinal) {
      gotFinal = true;
      callSilence = 0;
      callListenGen++;
      try { r.stop(); } catch (e) {}
      handleCallUtterance(fin.trim());
    }
  };
  r.onend = () => {
    if (myLG !== callListenGen || !callActive || callThinking || gotFinal) return;
    callSilence++;
    callListen();
  };
  r.onerror = (ev) => {
    if (myLG !== callListenGen || !callActive || callThinking || gotFinal) return;
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      endCall(true);
      setCallStatus("Microphone unavailable");
      toast("Mic blocked — allow microphone access");
    } else if (ev.error === "audio-capture") {
      endCall(true);
      setCallStatus("Microphone unavailable");
      toast("Microphone unavailable on this device");
    } else if (ev.error !== "aborted") {
      callListenGen++;
      callListen();
    }
  };

    setTimeout(() => { if (myLG === callListenGen && callActive && !callThinking) callListen(); }, 250);
  }

async function handleCallUtterance(text) {

  setCallTranscript("You: " + text);

        did429 = true;
        setCallStatus("Free server is busy — retrying…");
        setCallTranscript("One sec — the free server needs a breather…");
        await sleep(9000);
        if (myGen !== callGen || !callActive) return;
        fatalErr = null;
      } else break;
    }
    if (slowTimer) clearTimeout(slowTimer);
    if (!full) throw (fatalErr || new Error("empty response"));
  } catch (e) {
    if (slowTimer) clearTimeout(slowTimer);
    if (typing.parentElement) typing.remove();
    if (e.name === "AbortError") {
      if (conversation.length && conversation[conversation.length - 1].role === "user") conversation.pop();
      saveCurrentChat();
      return;
    }
    full = "";
    let m = "Sorry — say that again";
    if (e) {
      if (typeof e.message === "string" && e.message) m = e.message;
      else if (typeof e.error === "string" && e.error) m = e.error;
      else if (e.error && e.error.message) m = e.error.message;
    }
    const low = String(m).toLowerCase();
    if (low.includes("auth") || low.includes("sign in") || low.includes("permission") || low.includes("denied")) {
      bubble.innerHTML = "<span class='err'>⚠️ Puter needs a free sign-in — allow the popup once, then call again.</span>";
      setCallTranscript("Sign-in needed — allow the popup, then call again.");
      endCall(true);
      toast("Allow the Puter sign-in popup, then start the call again");
      return;
    }
    if (conversation.length && conversation[conversation.length - 1].role === "user") conversation.pop();
    saveCurrentChat();
    bubble.innerHTML = "<span class='err'>⚠️ " + String(m).replace(/</g, "&lt;") + "</span>";
    if (/429|rate|busy/i.test(String(m))) {
      setCallTranscript("Free server is busy — one sec…");
      setCallStatus("Retrying…");
      speakChunk("The free server is busy. Give me a few seconds.", detected, null);
      callThinking = true;
      abortCtrl = null;
      setTimeout(() => { if (!callActive || myGen !== callGen) return; callThinking = false; callListen(); }, 9000);
      return;
    }
    setCallTranscript("Hmm, that failed — try again.");
  }
  if (typing.parentElement) typing.remove();
  if (myGen !== callGen || !callActive) return;
  if (full) {
    appendStreaming(bubble, full);
    conversation.push({ role: "assistant", content: full });
    saveCurrentChat();
    setCallTranscript("HAKIMI: " + full.slice(0, 200));
    const tail = pendingBuf.trim();
    if (tail) queueSpeech(tail);
    streamDone = true;
    if (!spokeAny) { callThinking = false; abortCtrl = null; callListen(); return; }
    maybeFinish();
  } else {
    streamDone = true;
    callThinking = false;
    abortCtrl = null;
    callListen();
  }
}

/* ---------- Vision: ask about photos (free via Puter) ---------- */
let pendingImage = null;

function dataUrlFromImageFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const MAX = 1024;
        let w = img.width, h = img.height;
        const scale = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg", 0.85));
      } catch (err) { URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

function showAttachPreview() {
  const bar = $("attachBar");
  if (!pendingImage) { bar.classList.remove("show"); return; }
  $("attachThumb").src = pendingImage.dataUrl;
  $("attachName").textContent = pendingImage.name || "photo.jpg";
  bar.classList.add("show");
}
function clearAttachment() { pendingImage = null; $("fileInput").value = ""; showAttachPreview(); }

$("attachBtn").onclick = () => $("fileInput").click();
$("attachClear").onclick = clearAttachment;
$("fileInput").addEventListener("change", async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  if (!f.type.startsWith("image/")) { toast("Please pick an image file"); return; }
  if (f.size > 12 * 1024 * 1024) { toast("Image too large — pick one under 12MB"); return; }
  toast("Preparing photo…");
  try {
    const dataUrl = await dataUrlFromImageFile(f);
    pendingImage = { dataUrl: dataUrl, name: f.name };
    showAttachPreview();
    if (imageMode) {
      toast("Photo attached — describe how to edit it, then send");
    } else {
      toast("Photo attached — type a question or just send");
    }
  } catch (err) {
    toast("Couldn't read that image — try another");
  }
});

function extractChatText(resp) {
  if (!resp) return "";
  if (typeof resp === "string") return resp;
  if (typeof resp.text === "string") return resp.text;
  const c = resp.message && resp.message.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c)) return c.map(b => (b && (b.text || b.content)) || "").join("");
  if (c && typeof c === "object" && typeof c.text === "string") return c.text;
  return "";
}

async function sendVision(question, img) {
  if ($("provider").value !== "pollinations") {
    $("provider").value = "pollinations";
    $("modelName").value = PROVIDERS.pollinations.model;
    saveSettings(); updateStatus(); toggleKeyField();
    toast("Switched to Free Forever mode for vision");
  }
  const q = question || "What do you see in this image? Describe it in detail.";
  const userBubble = addMessage("user");
  userBubble.innerHTML = "";
  const th = document.createElement("img");
  th.className = "attached"; th.src = img.dataUrl; th.alt = img.name || "photo";
  userBubble.appendChild(th);
  const cap = document.createElement("div");
  cap.textContent = q;
  userBubble.appendChild(cap);
  conversation.push({ role: "user", content: "[Photo: " + (img.name || "image") + "] " + q, img: img.dataUrl });

  const bubble = addMessage("bot");
  const typing = document.createElement("div");
  typing.className = "typing"; typing.innerHTML = "<span></span><span></span><span></span>";
  bubble.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  let full = "";
  const langPref = $("replyLang").value;
  let sysText = SYSTEM_PROMPT;
  if (langPref !== "auto") sysText += " Reply in " + langPref + ".";
  const modelsToTry = [$("modelName").value || "openai", "openai"];
  try {
    let lastErr = null;
    for (const vm of modelsToTry) {
      try {
        const vMessages = [{ role: "system", content: sysText }].concat(apiMessages().slice(0, -1)).concat([{ role: "user", content: [{ type: "text", text: q }, { type: "image_url", image_url: { url: img.dataUrl } }] }]);
        const res = await fetch(chatUrl(), {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
          body: JSON.stringify({ model: vm, messages: vMessages, stream: true, max_tokens: 1200, temperature: 0.7 })
        });
        if (!res.ok) throw new Error(res.status === 429 ? "Free server is busy (rate limit) — wait a few seconds and resend" : "HTTP " + res.status);
        full = "";
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let vbuf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          vbuf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = vbuf.indexOf("\n")) >= 0) {
            const line = vbuf.slice(0, nl).trim();
            vbuf = vbuf.slice(nl + 1);
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (data === "[DONE]") break;
            try {
              const obj = JSON.parse(data);
              const delta = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
              if (delta) full += delta;
            } catch (pe) {}
          }
          if (typing.parentElement) typing.remove();
          appendStreaming(bubble, full);
        }
        if (!full) throw new Error("empty response");
        lastErr = null;
        break;
      } catch (e2) { lastErr = e2; full = ""; }
    }
    if (!full) throw (lastErr || new Error("Vision failed"));
    conversation.push({ role: "assistant", content: full });
    saveCurrentChat();
    if (isAutoRead()) speakText(full, null);
  } catch (e) {
    if (typing.parentElement) typing.remove();
    if (conversation.length && conversation[conversation.length - 1].role === "user") conversation.pop();
    saveCurrentChat();
    let m = "Couldn't analyze that photo — try another image";
    if (e) {
      if (typeof e.message === "string" && e.message) m = e.message;
      else if (typeof e.error === "string" && e.error) m = e.error;
      else if (e.error && e.error.message) m = e.error.message;
    }
    const low = String(m).toLowerCase();
    if (low.includes("rate") || low.includes("429") || low.includes("busy")) {
      m = "Free server is busy (1 msg per ~15s) — wait a few seconds and resend.";
    } else if (low.includes("auth") || low.includes("sign in") || low.includes("permission") || low.includes("denied")) {
      m = "That model refused the image — try again, or switch Provider to Puter for Claude vision.";
    }
    bubble.innerHTML = "<span class='err'>⚠️ " + String(m).replace(/</g, "&lt;") + "</span>";
  }
}
