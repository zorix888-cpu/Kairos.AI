<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050506" />
    <title>HAKIMI — Personal Intelligence Environment</title>
    <meta
      name="description"
      content="HAKIMI private luxury intelligence environment with text, voice, memory, documents, and a 3D core."
    />
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.2/examples/js/controls/OrbitControls.js"></script>
    <style>
      :root {
        --black: #050506;
        --ink: #0a0a0c;
        --panel: rgba(18, 18, 21, 0.72);
        --panel-solid: #111114;
        --line: rgba(255, 255, 255, 0.12);
        --line-strong: rgba(255, 255, 255, 0.26);
        --white: #f4f1eb;
        --muted: #9b9a98;
        --soft: #c8c3ba;
        --silver: #d9d3c8;
        --accent: #d6c5a5;
        --accent-2: #887b66;
        --success: #b7d3bd;
        --danger: #e0aaa4;
        --radius: 24px;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--black);
        color: var(--white);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        overflow: hidden;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 3px;
      }
      #app {
        height: 100svh;
        min-height: 640px;
        position: relative;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 46%,
          #171514 0%,
          #080809 45%,
          #030304 100%
        );
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .scene-shade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at center,
            transparent 0%,
            rgba(0, 0, 0, 0.06) 45%,
            rgba(0, 0, 0, 0.62) 100%
          ),
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.32),
            transparent 25%,
            transparent 75%,
            rgba(0, 0, 0, 0.54)
          );
      }
      .grain {
        position: absolute;
        inset: -50%;
        pointer-events: none;
        opacity: 0.045;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
        mix-blend-mode: screen;
        animation: grain 1s steps(2) infinite;
      }
      @keyframes grain {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(2%, -1%);
        }
        50% {
          transform: translate(-1%, 2%);
        }
        75% {
          transform: translate(1%, 1%);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      .topbar {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        right: 0;
        height: 76px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 clamp(18px, 4vw, 54px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(
          180deg,
          rgba(4, 4, 5, 0.86),
          rgba(4, 4, 5, 0.2)
        );
        backdrop-filter: blur(18px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 210px;
      }
      .mark {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        position: relative;
        background: radial-gradient(
          circle at 34% 28%,
          #fff 0 4%,
          #cbbd9f 12%,
          #4c463c 42%,
          #0b0b0c 72%
        );
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.3),
          0 0 22px rgba(214, 197, 165, 0.2);
      }
      .mark:before,
      .mark:after {
        content: "";
        position: absolute;
        inset: -5px;
        border: 1px solid rgba(214, 197, 165, 0.5);
        border-radius: 50%;
        transform: rotate(28deg);
      }
      .mark:after {
        inset: -9px;
        opacity: 0.35;
        transform: rotate(-38deg);
      }
      .brand-name {
        font-weight: 700;
        letter-spacing: 0.22em;
        font-size: 14px;
      }
      .brand-sub {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .top-status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px var(--success);
      }
      .top-spacer {
        flex: 1;
      }
      .top-actions {
        display: flex;
        gap: 8px;
      }
      .icon-btn,
      .ghost-btn {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.045);
        border-radius: 12px;
        min-width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        transition: 0.25s var(--ease);
      }
      .icon-btn:hover,
      .ghost-btn:hover {
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
      }
      .icon-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 20px rgba(214, 197, 165, 0.14);
      }
      .layout {
        position: absolute;
        z-index: 2;
        inset: 76px 0 0;
        display: grid;
        grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(
            270px,
            330px
          );
        gap: 18px;
        padding: 18px clamp(16px, 3vw, 46px) 22px;
      }
      .rail,
      .workspace,
      .inspector {
        min-height: 0;
      }
      .rail,
      .inspector {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .glass {
        background: linear-gradient(
          145deg,
          rgba(29, 28, 27, 0.67),
          rgba(10, 10, 12, 0.58)
        );
        border: 1px solid var(--line);
        box-shadow:
          var(--shadow),
          inset 0 1px rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(22px);
        border-radius: var(--radius);
      }
      .rail-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 17px 18px 12px;
      }
      .eyebrow {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .rail-section {
        padding: 0 10px 12px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 8px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .nav-item,
      .session {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        border: 1px solid transparent;
        border-radius: 14px;
        background: transparent;
        padding: 11px 10px;
        color: var(--soft);
        text-align: left;
        transition: 0.25s var(--ease);
      }
      .nav-item:hover,
      .session:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--line);
      }
      .nav-item.active,
      .session.active {
        background: linear-gradient(
          90deg,
          rgba(214, 197, 165, 0.16),
          rgba(255, 255, 255, 0.025)
        );
        border-color: rgba(214, 197, 165, 0.3);
        color: var(--white);
      }
      .nav-icon {
        width: 20px;
        color: var(--accent);
        text-align: center;
      }
      .session-list {
        max-height: 220px;
        overflow: auto;
      }
      .session strong {
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session small {
        display
